name: Reusable Java Prepare

on:
  workflow_call:
    inputs:
      module:
        description: 'Gradle submodule name (e.g., config-service). Empty for single-module projects.'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'Project version extracted from Gradle (semver only, used for Docker image tag)'
        value: ${{ jobs.prepare.outputs.version }}
      tag-name:
        description: 'Git tag name. Includes module prefix for multi-module (e.g., config-service-2.1.5)'
        value: ${{ jobs.prepare.outputs.tag-name }}
      java-version:
        description: 'Detected Java version'
        value: ${{ jobs.prepare.outputs.java-version }}
      should-skip:
        description: 'Whether subsequent build/image steps should be skipped'
        value: ${{ jobs.prepare.outputs.should-skip }}
      source-sha:
        description: 'Commit associated with the version image and Git tag'
        value: ${{ jobs.prepare.outputs.source-sha }}
      tag-exists:
        description: 'Whether the version Git tag already exists'
        value: ${{ jobs.prepare.outputs.tag-exists }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-name: ${{ steps.version.outputs.tag-name }}
      java-version: ${{ steps.java-info.outputs.version }}
      should-skip: ${{ steps.check-state.outputs.skip }}
      source-sha: ${{ steps.check-state.outputs.source-sha }}
      tag-exists: ${{ steps.check-state.outputs.tag-exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Detect Java version
        id: java-info
        env:
          MODULE: ${{ inputs.module }}
        run: |
          BUILD_FILES=()
          if [ -n "$MODULE" ]; then
            BUILD_FILES+=("$MODULE/build.gradle" "$MODULE/build.gradle.kts")
          fi
          BUILD_FILES+=("build.gradle" "build.gradle.kts")

          for BUILD_FILE in "${BUILD_FILES[@]}"; do
            [ -f "$BUILD_FILE" ] || continue

            VERSION=$(grep -Eo "JavaLanguageVersion.of\([0-9]+\)" "$BUILD_FILE" | head -1 | sed -E 's/[^0-9]//g')
            VERSION=${VERSION:-$(grep -Eo "(source|target)Compatibility[[:space:]]*=[[:space:]]*['\"]?[0-9]+['\"]?" "$BUILD_FILE" | head -1 | sed -E 's/[^0-9]//g')}
            VERSION=${VERSION:-$(grep -Eo "JavaVersion\.VERSION_[0-9]+" "$BUILD_FILE" | head -1 | sed -E 's/[^0-9]//g')}

            if [ -n "$VERSION" ]; then
              break
            fi
          done

          if [ -z "$VERSION" ]; then
            echo "❌ Error: Could not extract Java version from Gradle build files: ${BUILD_FILES[*]}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Detected Java version: $VERSION ($BUILD_FILE)"

      - name: Set up JDK ${{ steps.java-info.outputs.version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ steps.java-info.outputs.version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract version from build.gradle
        id: version
        env:
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x gradlew

          GRADLE_TASK="${MODULE:+:$MODULE:}properties"
          VERSION=$(./gradlew "$GRADLE_TASK" -q --no-daemon | grep "^version:" | awk '{print $2}')

          if [ -z "$VERSION" ] || [ "$VERSION" = "unspecified" ]; then
            echo "❌ Error: Could not extract version from Gradle properties"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Version '$VERSION' must be a stable SemVer value (for example, 1.2.3)"
            exit 1
          fi

          TAG_NAME="${MODULE:+$MODULE-}$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Detected project version: $VERSION (tag: $TAG_NAME)"

      - name: Resolve tag and release state
        id: check-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_VERSION: ${{ steps.java-info.outputs.version }}
          MODULE: ${{ inputs.module }}
          TAG_NAME: ${{ steps.version.outputs.tag-name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SKIP="false"
          REASON=""
          TAG_EXISTS="false"
          SOURCE_SHA="$GITHUB_SHA"

          REMOTE_TAG_SHA=$(git ls-remote --refs origin "refs/tags/$TAG_NAME" | awk 'NR == 1 { print $1 }')
          if [ -n "$REMOTE_TAG_SHA" ]; then
            TAG_EXISTS="true"
            SOURCE_SHA="$REMOTE_TAG_SHA"
          fi

          if [ "$VERSION" = "0.0.0" ]; then
            SKIP="true"
            REASON="Initial version (0.0.0)"
          else
            RELEASE_JSON="$RUNNER_TEMP/release-state.json"
            HTTP_STATUS=$(curl -sS -o "$RELEASE_JSON" -w "%{http_code}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/$TAG_NAME")

            case "$HTTP_STATUS" in
              200)
                if [ "$TAG_EXISTS" != "true" ]; then
                  echo "❌ Error: Release $TAG_NAME exists without a matching Git tag"
                  exit 1
                fi
                if ! jq -e '.draft == false and .prerelease == false' "$RELEASE_JSON" >/dev/null; then
                  echo "❌ Error: Existing release $TAG_NAME is not a published stable release"
                  exit 1
                fi
                SKIP="true"
                REASON="Stable release $TAG_NAME already exists"
                ;;
              404)
                ;;
              *)
                echo "❌ Error: Failed to check release $TAG_NAME (HTTP $HTTP_STATUS)"
                exit 1
                ;;
            esac
          fi

          {
            echo "skip=$SKIP"
            echo "source-sha=$SOURCE_SHA"
            echo "tag-exists=$TAG_EXISTS"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 📊 Prepare Summary"
            echo "- **Version**: \`$VERSION\`"
            echo "- **Tag**: \`$TAG_NAME\`"
            echo "- **Java**: \`$JAVA_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MODULE" ]; then
            echo "- **Module**: \`$MODULE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SKIP" = "true" ]; then
            echo "- **Status**: ⚠️ Skipped ($REASON)" >> "$GITHUB_STEP_SUMMARY"
          fi
