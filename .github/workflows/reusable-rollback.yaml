name: Reusable Rollback

on:
  workflow_call:
    inputs:
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      module:
        description: 'Gradle submodule name (e.g., config). Used to filter releases in monorepo. Empty for single-module projects.'
        required: false
        type: string
        default: ''
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for gh cli context)
        uses: actions/checkout@v6

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Get last stable release
        id: last_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE: ${{ inputs.module }}
        run: |
          RELEASE_LINES=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | [.tagName, .isPrerelease] | @tsv')

          CANDIDATE_RELEASES=()
          while IFS=$'\t' read -r TAG IS_PRERELEASE; do
            [ -n "$TAG" ] || continue

            if [ -n "$MODULE" ]; then
              TAG_MODULE=$(echo "$TAG" | sed -nE 's/^(.+)-[0-9]+\.[0-9]+\.[0-9]+[^ ]*$/\1/p')
              [ "$TAG_MODULE" = "$MODULE" ] || continue
            fi

            CANDIDATE_RELEASES+=("$TAG|$IS_PRERELEASE")
          done <<< "$RELEASE_LINES"

          if [ ${#CANDIDATE_RELEASES[@]} -eq 0 ]; then
            echo "❌ No releases found"
            exit 1
          fi

          LATEST_INFO="${CANDIDATE_RELEASES[0]}"

          IFS='|' read -r LATEST_TAG LATEST_IS_PRERELEASE <<< "$LATEST_INFO"

          LAST_RELEASE=""
          STABLE_SEEN=0
          for RELEASE_INFO in "${CANDIDATE_RELEASES[@]}"; do
            IFS='|' read -r TAG IS_PRERELEASE <<< "$RELEASE_INFO"
            [ "$IS_PRERELEASE" = "false" ] || continue

            if [ "$LATEST_IS_PRERELEASE" = "true" ]; then
              LAST_RELEASE="$TAG"
              break
            fi

            STABLE_SEEN=$((STABLE_SEEN + 1))
            if [ "$STABLE_SEEN" -eq 2 ]; then
              LAST_RELEASE="$TAG"
              break
            fi
          done

          if [ -z "$LAST_RELEASE" ]; then
            echo "❌ No stable release found"
            exit 1
          fi

          # Strip optional module prefix (e.g. "config-2.1.5" -> "2.1.5") for Docker image tag
          if [ -n "$MODULE" ]; then
            VERSION=$(echo "$LAST_RELEASE" | sed -nE 's/^.+-([0-9]+\.[0-9]+\.[0-9]+[^ ]*)$/\1/p')
          else
            VERSION=$(echo "$LAST_RELEASE" | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+[^ ]*)$/\1/p')
          fi

          if [ -z "$VERSION" ]; then
            echo "❌ Could not extract semver from tag: $LAST_RELEASE"
            exit 1
          fi

          echo "last=$LAST_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Last stable release: $LAST_RELEASE (version: $VERSION)"

      - name: Log in to container registry
        env:
          REGISTRY_ORG: ${{ inputs.registry-org }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: |
          REGISTRY_HOST="${REGISTRY_ORG%%/*}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin

      - name: Retag last stable image as latest
        env:
          MODULE: ${{ inputs.module }}
          REGISTRY_ORG: ${{ inputs.registry-org }}
          VERSION: ${{ steps.last_release.outputs.version }}
        run: |
          SERVICE_NAME="$MODULE"
          if [ -z "$SERVICE_NAME" ]; then
            SERVICE_NAME="${{ github.event.repository.name }}"
          fi

          IMAGE_NAME="$REGISTRY_ORG/$SERVICE_NAME"

          echo "🔄 Rolling back $IMAGE_NAME:$VERSION → $IMAGE_NAME:latest"

          docker pull "$IMAGE_NAME:$VERSION"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

      - name: Summary
        env:
          LAST_RELEASE: ${{ steps.last_release.outputs.last }}
          MODULE: ${{ inputs.module }}
        run: |
          SERVICE_NAME="$MODULE"
          if [ -z "$SERVICE_NAME" ]; then
            SERVICE_NAME="${{ github.event.repository.name }}"
          fi

          echo "### 🔁 Rollback Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`$SERVICE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Restored**: \`$LAST_RELEASE\` → \`latest\`" >> $GITHUB_STEP_SUMMARY
