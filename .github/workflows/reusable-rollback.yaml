name: Reusable Rollback

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name for Docker image tagging'
        required: false
        type: string
        default: '${{ github.event.repository.name }}'
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      module:
        description: 'Gradle submodule name (e.g., config). Used to filter releases in monorepo. Empty for single-module projects.'
        required: false
        type: string
        default: ''
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for gh cli context)
        uses: actions/checkout@v4

      - name: Get last stable release
        id: last_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ inputs.module }}"

          if [ -n "$MODULE" ]; then
            # Monorepo: filter releases whose tag starts with "<module>-"
            PREFIX="${MODULE}-"
            LATEST_INFO=$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | .[0] | \"\(.tagName)|\(.isPrerelease)\"")
          else
            LATEST_INFO=$(gh release list --limit 1 --json tagName,isPrerelease \
              --jq '.[0] | "\(.tagName)|\(.isPrerelease)"')
          fi

          IFS='|' read -r LATEST_TAG LATEST_IS_PRERELEASE <<< "$LATEST_INFO"

          if [ -n "$MODULE" ]; then
            PREFIX="${MODULE}-"
            if [ "$LATEST_IS_PRERELEASE" = "true" ]; then
              LAST_RELEASE=$(gh release list --limit 100 --json tagName,isPrerelease \
                --jq "[.[] | select(.tagName | startswith(\"$PREFIX\")) | select(.isPrerelease == false)] | .[0].tagName")
            else
              LAST_RELEASE=$(gh release list --limit 100 --json tagName,isPrerelease \
                --jq "[.[] | select(.tagName | startswith(\"$PREFIX\")) | select(.isPrerelease == false)] | .[1].tagName")
            fi
          else
            if [ "$LATEST_IS_PRERELEASE" = "true" ]; then
              LAST_RELEASE=$(gh release list --exclude-pre-releases --limit 1 --json tagName \
                --jq '.[0].tagName')
            else
              LAST_RELEASE=$(gh release list --exclude-pre-releases --limit 2 --json tagName \
                --jq '.[1].tagName')
            fi
          fi

          if [ -z "$LAST_RELEASE" ]; then
            echo "❌ No stable release found"
            exit 1
          fi

          # Strip optional module prefix (e.g. "config-2.1.5" → "2.1.5") for Docker image tag
          VERSION=$(echo "$LAST_RELEASE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*$')

          if [ -z "$VERSION" ]; then
            echo "❌ Could not extract semver from tag: $LAST_RELEASE"
            exit 1
          fi

          echo "last=$LAST_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Last stable release: $LAST_RELEASE (version: $VERSION)"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.registry-password }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Retag last stable image as latest
        run: |
          IMAGE_NAME="${{ inputs.registry-org }}/${{ inputs.service-name }}"
          VERSION="${{ steps.last_release.outputs.version }}"

          echo "🔄 Rolling back $IMAGE_NAME:$VERSION → $IMAGE_NAME:latest"

          docker pull "$IMAGE_NAME:$VERSION"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

      - name: Summary
        run: |
          echo "### 🔁 Rollback Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ inputs.service-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Restored**: \`${{ steps.last_release.outputs.last }}\` → \`latest\`" >> $GITHUB_STEP_SUMMARY
