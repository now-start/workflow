name: Reusable Java Docker Image

on:
  workflow_call:
    inputs:
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      environment:
        description: 'Deployment environment (e.g., prd, dev)'
        required: false
        type: string
        default: 'prd'
      version:
        description: 'Project version (e.g., 1.2.3)'
        required: true
        type: string
      java-version:
        description: 'Java version for bootBuildImage'
        required: true
        type: string
      module:
        description: 'Gradle submodule name (e.g., config-service). Empty for single-module projects.'
        required: false
        type: string
        default: ''
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Build and Push Docker image
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MODULE: ${{ inputs.module }}
          REGISTRY_ORG: ${{ inputs.registry-org }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
          VERSION: ${{ inputs.version }}
        run: |
          SERVICE_NAME="$MODULE"

          if [ -z "$SERVICE_NAME" ]; then
            SERVICE_NAME="${{ github.event.repository.name }}"
          fi

          IMAGE_NAME="$REGISTRY_ORG/$SERVICE_NAME"

          if [ "$ENVIRONMENT" = "dev" ]; then
            POINTER_TAG="dev"
          else
            POINTER_TAG="latest"
          fi

          GRADLE_TASK="${MODULE:+:$MODULE:}bootBuildImage"

          echo "🏗️ Building Docker image: $IMAGE_NAME:$VERSION"
          ./gradlew $GRADLE_TASK \
            --imageName="$IMAGE_NAME:$VERSION" \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            -PBP_OCI_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
            -PBP_OCI_REVISION="${{ github.sha }}"

          REGISTRY_HOST="${REGISTRY_ORG%%/*}"

          echo "🔐 Logging in to $REGISTRY_HOST"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin

          echo "🚀 Pushing images"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:$POINTER_TAG"
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$POINTER_TAG"

          echo "### 🐳 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE_NAME:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE_NAME:$POINTER_TAG\`" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MODULE: ${{ inputs.module }}
          REGISTRY_ORG: ${{ inputs.registry-org }}
          VERSION: ${{ inputs.version }}
        run: |
          SERVICE_NAME="$MODULE"

          if [ -z "$SERVICE_NAME" ]; then
            SERVICE_NAME="${{ github.event.repository.name }}"
          fi

          IMAGE_NAME="$REGISTRY_ORG/$SERVICE_NAME"

          if [ "$ENVIRONMENT" = "dev" ]; then
            POINTER_TAG="dev"
          else
            POINTER_TAG="latest"
          fi

          docker rmi "$IMAGE_NAME:$VERSION" || true
          docker rmi "$IMAGE_NAME:$POINTER_TAG" || true
          docker builder prune -af || true
