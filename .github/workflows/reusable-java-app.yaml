name: Reusable Java App Orchestrator

on:
  workflow_call:
    inputs:
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      module:
        description: 'Gradle submodule name (e.g., config-service). Empty for single-module projects.'
        required: false
        type: string
        default: ''
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

concurrency:
  group: ${{ github.repository }}-${{ inputs.module || 'root' }}-${{ github.event_name }}-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR 에서는 빌드/배포 대신 테스트만 수행
  test-only:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/reusable-java-test.yaml
    with:
      module: ${{ inputs.module }}

  # main push → 준비 단계 (버전/Java 버전 추출, skip 여부 계산)
  prepare:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-java-prepare.yaml
    with:
      module: ${{ inputs.module }}

  # 준비 단계에서 skip=false 인 경우에만 Gradle 빌드/테스트 수행
  build:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.should-skip == 'false' }}
    needs: prepare
    uses: ./.github/workflows/reusable-java-test.yaml
    with:
      java-version: ${{ needs.prepare.outputs.java-version }}
      module: ${{ inputs.module }}

  # 빌드 성공 시 Docker 이미지 빌드/푸시
  docker:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.should-skip == 'false' }}
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-java-docker.yaml
    with:
      registry-org: ${{ inputs.registry-org }}
      version: ${{ needs.prepare.outputs.version }}
      java-version: ${{ needs.prepare.outputs.java-version }}
      module: ${{ inputs.module }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      tag-exists: ${{ needs.prepare.outputs.tag-exists }}
    secrets:
      registry-password: ${{ secrets.registry-password }}

  # Docker 성공 시 stable GitHub Release 생성
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.should-skip == 'false' }}
    needs: [prepare, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-java-release.yaml
    with:
      tag-name: ${{ needs.prepare.outputs.tag-name }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
