name: Reusable Promote Image to Prod

on:
  workflow_call:
    inputs:
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      tag-name:
        description: 'Git tag name for the release (e.g., 1.2.3)'
        required: true
        type: string
      module:
        description: 'Gradle submodule name. Used as Docker image name in monorepo. Empty for single-module projects.'
        required: false
        type: string
        default: ''
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for gh and git context)
        uses: actions/checkout@v6

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Log in to container registry
        env:
          REGISTRY_ORG: ${{ inputs.registry-org }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: |
          REGISTRY_HOST="${REGISTRY_ORG%%/*}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin

      - name: Promote image to latest
        env:
          MODULE: ${{ inputs.module }}
          REGISTRY_ORG: ${{ inputs.registry-org }}
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          SERVICE_NAME="$MODULE"
          if [ -z "$SERVICE_NAME" ]; then
            SERVICE_NAME="${{ github.event.repository.name }}"
          fi

          IMAGE_NAME="$REGISTRY_ORG/$SERVICE_NAME"
          # Strip optional module prefix (e.g. "config-2.1.5" → "2.1.5")
          VERSION=$(echo "$TAG_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*$')

          if [ -z "$VERSION" ]; then
            echo "❌ Could not extract semver from tag: $TAG_NAME"
            exit 1
          fi

          echo "🚀 Promoting $IMAGE_NAME:$VERSION → $IMAGE_NAME:latest"

          docker pull "$IMAGE_NAME:$VERSION"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

          echo "### 🚀 Promote to Latest (Prod)" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`$SERVICE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Promoted**: \`${VERSION}\` → \`latest\`" >> $GITHUB_STEP_SUMMARY
